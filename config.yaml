# Configuration for the universal multi-game / multi-language clip studio

# Defaults used by the UI and CLI wrappers
default_game: "Grand Theft Auto VI"
default_language: "en"
supported_languages:
  - en
  - uk
  - es
  - de
  - fr
  - pl
  - pt
  - ru
  - ja
  - ko

# Video dimensions (1080x1920 = 9:16)
width: 1080
height: 1920

# Whisper model configuration
whisper_model: "small"
compute_type: "int8"

# Subtitle styling
font_family: "DejaVu Sans"
font_size: 36
primary_color: "#FFFF00"
outline_thickness: 2
margin_v: 220  # vertical bottom margin

# Layout & margins
margin_x: 100
margin_y: 100

# Toggleable anti-duplicate fingerprinting
anti_duplicate_enabled: true
anti_duplicate_scale: 1.04
anti_duplicate_contrast: 1.03
anti_duplicate_saturation: 1.05
anti_duplicate_speed: 1.02

# Audio settings
audio_sample_rate: 44100
