name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint and lightweight runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml pillow imageio-ffmpeg

      - name: Bytecode compilation check
        shell: bash
        run: python -m py_compile app.py src/*.py tests/smoke_test.py

      - name: Ruff lint
        shell: bash
        run: ruff check .

      - name: Cross-platform FFmpeg, font, and language module check
        shell: bash
        run: |
          python -c "import src.ffmpeg_bin, src.fonts, src.languages; print('Modules loaded successfully')"
